<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <p class="status" id="status" hidden></p>

    <!-- 흰 큰 카드: 왼쪽 ABOUT ME, 오른쪽 PORTFOLIO -->
    <section class="sheet resume">
      <aside class="about">
        <p class="section-label">ABOUT ME</p>

        <div class="photo" id="photo">
          <img id="photo-img" alt="프로필 사진" hidden>
        </div>

        <h1 class="name" id="name"></h1>
        <p class="role" id="role"></p>
        <p class="badge" id="badge" hidden></p>

        <ul class="contacts">
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">NAME</span>
              <span id="c-name"></span>
            </span>
          </li>
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">EMAIL</span>
              <a id="c-email"></a>
            </span>
          </li>
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">PHONE</span>
              <a id="c-phone"></a>
            </span>
          </li>
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">LOCATION</span>
              <span id="c-location"></span>
            </span>
          </li>
        </ul>
      </aside>

      <div class="content">
        <h2 class="big-title">PORTFOLIO</h2>
        <p class="headline" id="headline"></p>
        <p class="intro" id="intro"></p>

        <div class="facts">
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
              </span>
              EDUCATION
            </h3>
            <div class="fact-body" id="education"></div>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/></svg>
              </span>
              SKILLS &amp; TOOLS
            </h3>
            <div class="fact-body chips" id="skills"></div>
          </div>
          <div class="fact">
            <h3 class="fact-title">
              <span class="fact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M3 13h18"/></svg>
              </span>
              EXPERIENCE
            </h3>
            <div class="fact-body" id="experience"></div>
          </div>
        </div>

        <section class="highlights">
          <h3 class="highlights-title">PORTFOLIO HIGHLIGHTS</h3>
          <div class="cards" id="cards"></div>
        </section>

        <blockquote class="quote" id="quote" hidden></blockquote>
      </div>
    </section>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="big-title">GUESTBOOK</h2>
      <p class="guestbook-help">별명과 한마디를 남겨 주세요.</p>

      <div class="guest-form">
        <label class="field field-nick">
          <span class="field-label">별명</span>
          <input type="text" id="gb-nickname" maxlength="20" placeholder="최대 20자" autocomplete="nickname">
        </label>
        <label class="field field-msg">
          <span class="field-label">한마디</span>
          <input type="text" id="gb-message" maxlength="200" placeholder="최대 200자">
        </label>
        <button type="button" class="btn-primary" id="gb-submit">남기기</button>
      </div>
      <p class="form-error" id="gb-error" hidden></p>

      <ul class="guest-list" id="gb-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
